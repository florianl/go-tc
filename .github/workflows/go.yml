on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

# Set default permissions as read only.
permissions: read-all

name: Go
jobs:

  go-test:
    strategy:
      matrix:
        go-version: ['1.18.x', 'oldstable', 'stable']
        platform: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Download Go dependencies
      env:
        GOPROXY: "https://proxy.golang.org"
      run: go mod download
    - name: Simple Tests
      if: matrix.platform != 'ubuntu-latest'
      run: go test -count=1 ./...
    - name: Test with -race
      if: matrix.platform == 'ubuntu-latest'
      run: go test -race -count=3 ./...
    - name: Test with -shuffle=on
      if: matrix.platform == 'ubuntu-latest' && startsWith(matrix.go-version, 'stable')
      run: go test -shuffle=on -count=3 ./...
    - name: Integrationtest for linux
      if: matrix.platform == 'ubuntu-latest'
      run: |
        go test -race -v -exec=sudo -tags integration -covermode=atomic -coverprofile=profile.cov ./...
    - name: coveralls.io
      if: matrix.platform == 'ubuntu-latest' && startsWith(matrix.go-version, 'stable')
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        go install github.com/mattn/goveralls@v0.0.12
        goveralls -v -tags integration -coverprofile=profile.cov -service=github
  code-check:
    strategy:
      matrix:
        go-version: ['stable']
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Download Go dependencies
      env:
        GOPROXY: "https://proxy.golang.org"
      run: go mod download
    - name: staticcheck.io
      uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
      with:
        version: "2026.2.1"
        install-go: false
        cache-key: ${{ matrix.go }}
